{% extends "base.html" %}

{% block title %}
{{ titulo }}
{% endblock %}

{% block content %}

<div class="card">

    {% set voltar = url_for('usuario.listar') %}

    {% include "components/card_header.html" %}

    <form method="POST" class="form">

        <div class="form-group">

            <label>Nome</label>

            <input
                type="text"
                name="nome"
                value="{{ usuario.nome if usuario else '' }}"
                required>

        </div>

        <div class="form-group">

            <label>Login</label>

            <input
                type="text"
                name="login"
                value="{{ usuario.login if usuario else '' }}"
                required>

        </div>

        <div class="form-group">

            <label>Senha</label>

            <input
                type="password"
                name="senha">

        </div>

        <div class="form-group">

            <label>Perfil</label>

            <select name="perfil">

                <option
                    value="Administrador"
                    {% if usuario and usuario.perfil=="Administrador" %}selected{% endif %}>
                    Administrador
                </option>

                <option
                    value="Operador"
                    {% if usuario and usuario.perfil=="Operador" %}selected{% endif %}>
                    Operador
                </option>

                <option
                value="Leitor"
                {% if usuario and usuario.perfil == "Leitor" %}selected{% endif %}>
                Leitor
            </option>

            </select>

        </div>

        {% set cancelar = url_for('usuario.listar') %}
        {% include "components/form_actions.html" %}

    </form>

</div>

{% endblock %}
