{% extends "base_auth.html" %}


{% block title %}

Login - SGJP

{% endblock %}


{% block content %}

<section class="login-card">

    <img
        src="{{ url_for(
            'static',
            filename='img/logo-jp-circular.png'
        ) }}"
        alt="JP Transportes"
        class="login-logo">


    <h1 class="login-title">

        SGJP

    </h1>


    <form
        method="POST"
        action="{{ url_for('autenticacao.login') }}">


        <div class="login-form-group">

            <label for="login">

                Usuário

            </label>

            <input
                type="text"
                id="login"
                name="login"
                autocomplete="username"
                required>

        </div>


        <div class="login-form-group">

            <label for="senha">

                Senha

            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required>

        </div>


        <button
            type="submit"
            class="login-button">

            Entrar

        </button>


    </form>

</section>

{% endblock %}
