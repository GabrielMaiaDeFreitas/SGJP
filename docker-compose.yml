services:
  postgres:
    image: postgres:17
    container_name: sgjp_postgres
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgjp"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sgjp_flask
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      FLASK_DEBUG: "False"

      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    ports:
      - "8000:8000"

volumes:
  postgres_data: